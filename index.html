<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Row Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Trường hợp 1: grid-row: 1 / 3 (Bắt đầu hàng 1, kết thúc hàng 3)</h2>
    <div class="grid-container ex1">
        <div class="item item1">Ô 1</div>
        <div class="item">Ô 2</div>
        <div class="item">Ô 3</div>
        <div class="item">Ô 4</div>
        <div class="item">Ô 5</div>
        <div class="item">Ô 6</div>
    </div>

    <hr style="margin: 30px 0;">

    <h2>Trường hợp 2: grid-row: 2 / 4 (Bắt đầu hàng 2, kết thúc hàng 4)</h2>
    <div class="grid-container ex2">
        <div class="item item1">Ô 1</div>
        <div class="item">Ô 2</div>
        <div class="item">Ô 3</div>
        <div class="item">Ô 4</div>
        <div class="item">Ô 5</div>
        <div class="item">Ô 6</div>
    </div>

    <hr style="margin: 30px 0;">

    <h2>Trường hợp 3: grid-row: span 2 (Kéo dài chiếm 2 hàng)</h2>
    <div class="grid-container ex3">
        <div class="item item1">Ô 1</div>
        <div class="item">Ô 2</div>
        <div class="item">Ô 3</div>
        <div class="item">Ô 4</div>
        <div class="item">Ô 5</div>
        <div class="item">Ô 6</div>
    </div>

</body>
</html>
